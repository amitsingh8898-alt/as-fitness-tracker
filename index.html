<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#b7ff00">
<link rel="manifest" href="manifest.json">
<title>AS Fitness Tracker — Amit Singh Fitness</title>
<style>
:root{
  --bg:#f5f7f6;
  --panel:#ffffff;
  --panel2:#f0f3f1;
  --text:#111514;
  --muted:#68716d;
  --line:#dfe5e2;
  --lime:#b7ff00;
  --lime-dark:#8fc900;
  --navy:#101817;
  --shadow:0 8px 30px rgba(16,24,23,.08);
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
}

.top{
  height:64px;
  background:var(--navy);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
}

.layout{
  display:grid;
  grid-template-columns:240px 1fr;
  min-height:calc(100vh - 64px);
}

.nav{
  background:#111918;
  color:#fff;
  padding:22px 16px;
}

.nav h2{
  margin:0 0 4px;
  font-size:20px;
}

.nav .sub{
  color:#aeb8b4;
  font-size:12px;
  margin-bottom:24px;
}

.nav button{
  width:100%;
  border:0;
  background:transparent;
  color:#dce3df;
  text-align:left;
  padding:12px 14px;
  border-radius:9px;
  margin-bottom:5px;
}

.nav button:hover{
  background:#202a27;
}

main{
  padding:28px;
  max-width:1400px;
  width:100%;
}

h1{
  margin:0 0 6px;
  font-size:30px;
  font-weight:800;
}

h2{
  margin:0;
}

.sub{
  color:var(--muted);
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:20px;
  box-shadow:var(--shadow);
}

.cards,
.grid{
  display:grid;
  gap:16px;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
}

.stats{
  margin:20px 0;
}

.stat span,
.label{
  display:block;
  color:var(--muted);
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.6px;
  margin-bottom:8px;
}

.stat b{
  font-size:25px;
}

.btn{
  border:0;
  background:var(--lime);
  color:#101817;
  padding:11px 17px;
  border-radius:9px;
  font-weight:800;
}

.btn:hover{
  background:var(--lime-dark);
}

.btn.dark{
  background:var(--navy);
  color:#fff;
}

.btn.outline{
  background:#fff;
  border:1px solid var(--line);
  color:var(--text);
}

.table{
  width:100%;
  border-collapse:collapse;
}

.table th,
.table td{
  padding:12px;
  border-bottom:1px solid var(--line);
  text-align:left;
}

.table th{
  color:var(--muted);
  font-size:12px;
  text-transform:uppercase;
}

input,
select,
textarea{
  width:100%;
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  color:var(--text);
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--lime-dark);
}

form{
  display:grid;
  gap:12px;
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.exercise{
  border:1px solid var(--line);
  background:#fff;
  border-radius:12px;
  padding:16px;
  margin-bottom:12px;
}

.login{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
  background:var(--navy);
}

.login>div{
  width:min(460px,100%);
}

.login .card{
  border:0;
}

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  background:var(--navy);
  color:#fff;
  padding:13px 17px;
  border-radius:9px;
  box-shadow:var(--shadow);
  z-index:1000;
}

.mobileNav{
  display:none;
}

@media(max-width:850px){
  .layout{
    grid-template-columns:1fr;
  }

  .nav{
    display:none;
  }

  .mobileNav{
    display:flex;
    position:sticky;
    top:0;
    z-index:50;
    background:var(--navy);
    color:#fff;
    padding:10px;
    gap:8px;
  }

  main{
    padding:18px;
  }

  .two{
    grid-template-columns:1fr;
  }

  .top{
    padding:0 16px;
  }

  h1{
    font-size:25px;
  }

  .table{
    font-size:13px;
  }
</style>

</head>
<body>
<div id="root"></div><div id="toast" class="toast"></div>
<script>
const KEY="asfit_v1";
let db=JSON.parse(localStorage.getItem(KEY)||"null")||{
  user:null,
  clients:[
    {id:"c1",name:"Rahul Sharma",goal:"Lean Muscle Gain",weight:76.8,height:170,joined:"2025-01-10"},
    {id:"c2",name:"Priya Mehta",goal:"Fat Loss",weight:64.2,height:165,joined:"2026-02-14"}
  ],
  exercises:["Bench Press","Squat","Lat Pulldown","Shoulder Press","Biceps Curl","Triceps Pushdown"],
  workouts:[
    {id:"w1",clientId:"c1",date:"2026-09-05",name:"Chest + Triceps",hr:142,rpe:8,note:"Good form. Increase weight next week.",duration:48,
      items:[{exercise:"Bench Press",sets:[{weight:70,reps:8},{weight:72.5,reps:8},{weight:72.5,reps:9}]}]},
    {id:"w2",clientId:"c1",date:"2026-08-29",name:"Chest + Triceps",hr:138,rpe:8,note:"Solid session.",duration:50,
      items:[{exercise:"Bench Press",sets:[{weight:70,reps:8},{weight:70,reps:8},{weight:70,reps:8}]}]}
  ]
};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function toast(t){let e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1800)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function initials(n){return n.split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase()}
function workoutCount(cid){return db.workouts.filter(w=>w.clientId===cid).length}
function bestFor(cid,ex){let a=[];db.workouts.filter(w=>w.clientId===cid).forEach(w=>w.items.forEach(i=>{if(i.exercise===ex)i.sets.forEach(s=>a.push(Number(s.weight)||0))}));return a.length?Math.max(...a):0}
function bmiFor(c){let h=Number(c.height)||0;let w=Number(c.weight)||0;return h>0&&w>0?(w/((h/100)**2)).toFixed(1):"—"}
function render(){db.user?renderApp():renderLogin()}
function renderLogin(){root.innerHTML=`<div class="login"><div class="loginbox"><div class="heroLogo">AS</div><h1>AS Fitness Tracker</h1><div class="sub">by Amit Singh Fitness</div><div class="field"><label>YOUR NAME</label><input id="loginName" value="${esc(db.user?.name||"Amit Singh")}" placeholder="Name"></div><div class="field"><label>LOGIN AS</label><div class="role"><button id="trainerRole" class="${db.role!=="client"?"sel":""}" onclick="setRole('trainer')">Trainer</button><button id="clientRole" class="${db.role==="client"?"sel":""}" onclick="setRole('client')">Client</button></div></div><button class="btn primary" style="width:100%;margin-top:16px" onclick="login()">Continue</button><p class="sub" style="margin-top:18px;font-size:12px">Prototype mode: data is stored in this browser. Secure cloud login/database comes next.</p></div></div>`}
function setRole(r){db.role=r;renderLogin()}
function login(){let n=document.getElementById("loginName").value.trim()||"Amit Singh";db.user={name:n,role:db.role||"trainer"};save();render()}
function logout(){db.user=null;save();render()}
function renderApp(){let trainer=db.user.role!=="client";root.innerHTML=`<div class="app"><header class="top"><div class="brand"><div class="logo">AS</div>AS FITNESS TRACKER</div><div><small>${trainer?"Trainer":"Client"} • ${esc(db.user.name)}</small> <button class="btn" onclick="logout()">Logout</button></div></header><div class="layout"><aside><nav>${trainer?`<button data-p="dashboard" onclick="page('dashboard')">▦ Dashboard</button><button data-p="clients" onclick="page('clients')">♙ Clients</button><button data-p="workouts" onclick="page('workouts')">▣ Workouts</button><button data-p="history" onclick="page('history')">◷ History</button><button data-p="progress" onclick="page('progress')">↗ Progress</button><button data-p="exercises" onclick="page('exercises')">⚙ Exercise Library</button>`:`<button data-p="clienthome" onclick="page('clienthome')">▦ Today</button><button data-p="history" onclick="page('history')">◷ History</button><button data-p="progress" onclick="page('progress')">↗ Progress</button>`}</nav></aside><main id="main"></main></div><div class="mobileNav">${trainer?`<button onclick="page('dashboard')">Home</button><button onclick="page('clients')">Clients</button><button onclick="page('workouts')">Workout</button><button onclick="page('history')">History</button><button onclick="page('progress')">Progress</button>`:`<button onclick="page('clienthome')">Today</button><button onclick="page('history')">History</button><button onclick="page('progress')">Progress</button>`}</div></div>`;page(trainer?"dashboard":"clienthome")}
function page(p){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.p===p));let m=document.getElementById("main");if(p==="dashboard")m.innerHTML=dashboard();else if(p==="clients")m.innerHTML=clients();else if(p==="workouts")m.innerHTML=workouts();else if(p==="history")m.innerHTML=history();else if(p==="progress")m.innerHTML=progress();else if(p==="exercises")m.innerHTML=exercises();else m.innerHTML=clienthome();}

function dashboard(){let sessions=db.workouts.length;return `<h1>Dashboard</h1><div class="sub">Welcome back, Amit. Coach smarter with every session.</div><div class="grid stats"><div class="card stat"><span>Total Clients</span><b>${db.clients.length}</b></div><div class="card stat"><span>Sessions Logged</span><b>${sessions}</b></div><div class="card stat"><span>Exercises</span><b>${db.exercises.length}</b></div><div class="card stat"><span>Active Tracking</span><b class="lime">100%</b></div></div><div class="grid cards" style="margin-top:14px"><div class="card"><div class="row"><h3>Quick Actions</h3><span class="pill">Trainer</span></div><div class="actions"><button class="btn primary" onclick="page('workouts')">+ Log Workout</button><button class="btn" onclick="page('clients')">+ Add Client</button></div></div><div class="card"><h3>Recent Session</h3><p>${db.workouts[0]?`${esc(db.workouts[0].name)} • ${esc(db.clients.find(c=>c.id===db.workouts[0].clientId)?.name||"Client")}<br><span class="label">${db.workouts[0].date} • ${db.workouts[0].duration} min • HR ${db.workouts[0].hr} bpm</span>`:"No sessions yet"}</p></div><div class="card"><h3>Brand Direction</h3><p class="sub" style="margin:0">Track • Coach • Progress • Transform</p></div></div>`}
function clients(){return `<h1>Clients</h1><div class="sub">Manage client profiles and long-term progress.</div><div class="actions" style="margin-bottom:14px"><button class="btn primary" onclick="addClient()">+ Add Client</button></div><div class="card"><table class="table"><thead><tr><th>Client</th><th>Goal</th><th>Weight</th><th>Sessions</th><th></th></tr></thead><tbody>${db.clients.map(c=>`<tr><td><div class="client"><div class="avatar">${initials(c.name)}</div><div>${esc(c.name)}<div class="label">${c.height} cm</div></div></div></td><td>${esc(c.goal)}</td><td>${c.weight} kg</td><td>${workoutCount(c.id)}</td><td><button class="btn" onclick="clientDetail('${c.id}')">Open</button></td></tr>`).join("")}</tbody></table></div>`}
function addClient(){let name=prompt("Client name");if(!name)return;let goal=prompt("Goal","Muscle Gain");let weight=Number(prompt("Current weight (kg)","70"))||0;let height=Number(prompt("Height (cm)","170"))||0;db.clients.push({id:"c"+Date.now(),name,goal,weight,height,joined:new Date().toISOString().slice(0,10)});save();toast("Client added");page("clients")}
function clientDetail(id){let c=db.clients.find(x=>x.id===id);let ws=db.workouts.filter(w=>w.clientId===id);main.innerHTML=`<button class="btn" onclick="page('clients')">← Back</button><h1 style="margin-top:18px">${esc(c.name)}</h1><div class="sub">${esc(c.goal)} • Joined ${c.joined}</div><div class="grid stats"><div class="card stat"><span>Weight</span><b>${c.weight} kg</b></div><div class="card stat"><span>Height</span><b>${c.height} cm</b></div><div class="card stat"><span>Sessions</span><b>${ws.length}</b></div><div class="card stat"><span>Bench Best</span><b>${bestFor(id,"Bench Press")||"—"} kg</b></div></div><div class="card" style="margin-top:14px"><h3>Client Notes</h3><textarea id="cnote" rows="4" placeholder="Private trainer notes..."></textarea><button class="btn primary" style="margin-top:10px" onclick="toast('Note saved for prototype')">Save Note</button></div>`}
const originalClientDetail=clientDetail;clientDetail=function(id){originalClientDetail(id);let c=db.clients.find(x=>x.id===id);let s=document.querySelector(".stats");if(c&&s)s.insertAdjacentHTML("beforeend",`<div class="card stat"><span>BMI</span><b>${bmiFor(c)}</b></div>`)}
function workouts(){return `<h1>Log Workout</h1><div class="sub">Record every set so the full training history stays available.</div><div class="card"><form id="wf"><div class="grid two"><div class="field"><label>CLIENT</label><select id="wid">${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></div><div class="field"><label>WORKOUT NAME</label><input id="wname" value="Full Body"></div><div class="field"><label>DATE</label><input id="wdate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>HEART RATE (AVG)</label><input id="whr" type="number" placeholder="142"></div><div class="field"><label>RPE (1–10)</label><input id="wrpe" type="number" min="1" max="10" placeholder="8"></div><div class="field"><label>DURATION (MIN)</label><input id="wdur" type="number" placeholder="60"></div></div><div id="exbox"></div><div class="actions"><button type="button" class="btn" onclick="addExerciseRow()">+ Add Exercise</button><button type="button" class="btn primary" onclick="saveWorkout()">Save Workout</button></div></form></div>`}
let exRows=[];
function addExerciseRow(){exRows.push({exercise:db.exercises[0],sets:[{weight:"",reps:""}]});drawExercises()}
function drawExercises(){let box=document.getElementById("exbox");if(!box)return;if(!exRows.length)addExerciseRow();else box.innerHTML=exRows.map((e,ei)=>`<div class="exercise"><div class="row"><select onchange="exRows[${ei}].exercise=this.value">${db.exercises.map(x=>`<option ${x===e.exercise?"selected":""}>${esc(x)}</option>`).join("")}</select><button type="button" class="btn danger" onclick="exRows.splice(${ei},1);drawExercises()">Remove</button></div><table class="sets"><thead><tr><th>Set</th><th>Weight kg</th><th>Reps</th><th></th></tr></thead><tbody>${e.sets.map((s,si)=>`<tr><td>${si+1}</td><td><input type="number" step="0.5" value="${s.weight}" onchange="exRows[${ei}].sets[${si}].weight=this.value"></td><td><input type="number" value="${s.reps}" onchange="exRows[${ei}].sets[${si}].reps=this.value"></td><td><button type="button" class="btn" onclick="exRows[${ei}].sets.push({weight:'',reps:''});drawExercises()">+ Set</button></td></tr>`).join("")}</tbody></table></div>`).join("")}
function saveWorkout(){let items=exRows.map(e=>({exercise:e.exercise,sets:e.sets.filter(s=>s.weight!==""&&s.reps!=="").map(s=>({weight:Number(s.weight),reps:Number(s.reps)}))})).filter(e=>e.sets.length);if(!items.length){toast("Add at least one completed set");return}db.workouts.unshift({id:"w"+Date.now(),clientId:document.getElementById("wid").value,date:document.getElementById("wdate").value,name:document.getElementById("wname").value||"Workout",hr:Number(document.getElementById("whr").value)||0,rpe:Number(document.getElementById("wrpe").value)||0,duration:Number(document.getElementById("wdur").value)||0,note:"",items});save();exRows=[];toast("Workout saved permanently in this browser");page("history")}
function history(){let client=db.user.role==="client"?db.clients[0]:null;let ws=client?db.workouts.filter(w=>w.clientId===client.id):db.workouts;return `<h1>Workout History</h1><div class="sub">Searchable timeline of every recorded workout.</div><div class="card"><table class="table"><thead><tr><th>Date</th><th>Client</th><th>Workout</th><th>HR</th><th>RPE</th><th>Exercises</th></tr></thead><tbody>${ws.length?ws.map(w=>`<tr><td>${w.date}</td><td>${esc(db.clients.find(c=>c.id===w.clientId)?.name||"")}</td><td>${esc(w.name)}</td><td>${w.hr||"—"} bpm</td><td>${w.rpe||"—"}</td><td>${w.items.length}</td></tr>`).join(""):`<tr><td colspan="6" class="empty">No workouts yet.</td></tr>`}</tbody></table></div>`}
function progress(){let c=db.clients[0], ex="Bench Press", points=[];db.workouts.filter(w=>w.clientId===c.id).slice().reverse().forEach(w=>w.items.forEach(i=>{if(i.exercise===ex)i.sets.forEach(s=>points.push({date:w.date,v:s.weight}))}));let max=Math.max(100,...points.map(x=>x.v));let bars=points.slice(-12).map((p,i)=>`<div style="flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:4px"><span style="font-size:10px">${p.v}</span><div style="width:70%;height:${Math.max(10,p.v/max*150)}px;background:var(--lime);border-radius:6px 6px 0 0"></div><span style="font-size:9px;color:var(--muted)">${p.date.slice(5)}</span></div>`).join("");return `<h1>Progress</h1><div class="sub">Strength progression and long-term performance.</div><div class="grid stats"><div class="card stat"><span>Current Best</span><b>${bestFor(c.id,ex)||"—"} kg</b></div><div class="card stat"><span>Previous Best</span><b>70 kg</b></div><div class="card stat"><span>Exercise</span><b style="font-size:18px">${ex}</b></div><div class="card stat"><span>History</span><b>All Time</b></div></div><div class="card" style="margin-top:14px"><h3>${ex} — Weight Progress</h3><div style="height:210px;display:flex;align-items:end;gap:8px;padding:18px 8px 0">${bars||'<div class="empty" style="width:100%">Log workouts to build your chart.</div>'}</div></div>`}
function exercises(){return `<h1>Exercise Library</h1><div class="sub">Your reusable exercise list.</div><div class="card"><div class="actions" style="margin-bottom:14px"><input id="newex" placeholder="New exercise name" style="max-width:320px"><button class="btn primary" onclick="addEx()">Add Exercise</button></div>${db.exercises.map((e,i)=>`<div class="row" style="padding:12px 0;border-bottom:1px solid var(--line)"><span>${esc(e)}</span><button class="btn danger" onclick="db.exercises.splice(${i},1);save();page('exercises')">Delete</button></div>`).join("")}</div>`}
function addEx(){let e=document.getElementById("newex").value.trim();if(!e)return;db.exercises.push(e);save();page("exercises")}
function clienthome(){let c=db.clients[0], w=db.workouts.find(x=>x.clientId===c.id);return `<h1>Good evening, ${esc(db.user.name)}!</h1><div class="sub">Consistency creates results.</div><div class="card"><div class="row"><div><h2 style="margin:0">Today's Workout</h2><p class="sub" style="margin:5px 0">Chest + Triceps • 5 exercises</p></div><span class="pill lime">Ready</span></div><button class="btn primary" style="margin-top:10px" onclick="page('history')">View Workout History</button></div><div class="grid cards" style="margin-top:14px"><div class="card"><span class="label">Current Weight</span><h2>${c.weight} kg</h2></div><div class="card"><span class="label">Sessions</span><h2>${workoutCount(c.id)}</h2></div><div class="card"><span class="label">Bench Best</span><h2>${bestFor(c.id,"Bench Press")||"—"} kg</h2></div></div>`}
render();
</script>
</body>
</html>

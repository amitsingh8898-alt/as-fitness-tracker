<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AS Fitness Tracker</title>
<style>
:root{--bg:#070909;--card:#101414;--card2:#151a18;--line:#252d29;--lime:#c8ff35;--text:#f5f7f5;--muted:#9ca7a1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1100px;margin:auto;min-height:100vh;padding-bottom:82px}
.top{position:sticky;top:0;z-index:5;background:#090b0b;border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border:2px solid var(--lime);border-radius:10px;display:grid;place-items:center;color:var(--lime);font-weight:900}
.brand{font-weight:900;letter-spacing:1px}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.spacer{flex:1}
.wrap{padding:18px 16px}
.title{font-size:28px;margin:0 0 5px}
.muted{color:var(--muted)}
.small{font-size:12px}
.lime{color:var(--lime)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.stat b{font-size:25px;display:block;margin:7px 0}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AS Fitness Tracker</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif}
header{padding:20px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:24px;font-weight:800}.lime{color:#b7ff00}
main{padding:20px;padding-bottom:90px}
h1{font-size:28px;margin:10px 0 6px}
h2{font-size:22px;margin:22px 0 12px}
p{color:#aaa}
.card{background:#111;border:1px solid #292929;border-radius:16px;padding:18px;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#151515;border-radius:14px;padding:16px}
.stat b{font-size:25px;color:#b7ff00;display:block}
button{border:0;border-radius:10px;padding:13px 16px;background:#b7ff00;color:#000;font-weight:800;margin:5px 3px}
button.dark{background:#222;color:#fff;border:1px solid #444}
input,select,textarea{width:100%;padding:13px;background:#0b0b0b;color:#fff;border:1px solid #444;border-radius:9px;margin:5px 0 12px}
label{font-size:13px;color:#aaa}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 5px;border-bottom:1px solid #292929;text-align:center}
th{color:#b7ff00;font-size:12px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#101010;border-top:1px solid #292929;display:flex;justify-content:space-around;padding:9px 3px;z-index:10}
.nav button{background:transparent;color:#aaa;margin:0;padding:8px;font-size:12px}
.nav button.active{color:#b7ff00}
.hide{display:none}
.badge{display:inline-block;background:#b7ff00;color:#000;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:bold}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
</style>
</head>

<body>

let page="home";
let selectedClient=1;

function bmi(c){
  return c.height && c.weight ? (c.weight/((c.height/100)**2)).toFixed(1) : "—";
}

function nav(){
  ["Home","Clients","Workout","History","Progress"].forEach(x=>{
    const el=document.getElementById("nav"+x);
    if(el) el.classList.toggle("active",page===x.toLowerCase());
  });
}

function showPage(p){
  page=p;
  nav();
  if(p==="home") home();
  if(p==="clients") clients();
  if(p==="workout") workout();
  if(p==="history") historyPage();
  if(p==="progress") progress();
}

function home(){
app.innerHTML=`
<h1>Dashboard</h1>
<p>Good to see you, Amit.</p>

<div class="grid">
<div class="stat"><b>${db.clients.length}</b>Total Clients</div>
<div class="stat"><b>${db.workouts.length}</b>Sessions Logged</div>

</div>

<button onclick="showPage('workout')">＋ Log Workout</button>
<button onclick="addClient()" class="dark">＋ Add Client</button>
</div>

<div class="card">
<h2>Recent Session</h2>
${db.workouts.slice(0,2).map(w=>`
<div class="row">
<div><b>${w.client}</b><br><small style="color:#888">${w.exercise} • ${w.date}</small></div>
<div class="lime">${w.sets.length} sets</div>
</div><hr style="border-color:#222">
`).join("")}

}

function clients(){

${db.clients.map(c=>`
<div class="card" onclick="profile(${c.id})">
<div class="row">
<div><b>${c.name}</b><br><small style="color:#888">${c.goal}</small></div>
<div class="lime">BMI ${bmi(c)}</div>
</div>
</div>`).join("")}`;
}

function profile(id){
selectedClient=id;
const c=db.clients.find(x=>x.id===id);
app.innerHTML=`
<button class="dark" onclick="showPage('clients')">← Back</button>
<h1>${c.name}</h1>
<p>Client Profile</p>

<div class="grid">
<div class="stat"><small>Age</small><b>${c.age}</b></div>
<div class="stat"><small>Height</small><b>${c.height} cm</b></div>
<div class="stat"><small>Weight</small><b>${c.weight} kg</b></div>
<div class="stat"><small>BMI</small><b>${bmi(c)}</b></div>
</div>

<div class="card">
<p>Goal</p><b>${c.goal}</b>
<p>Training Days</p><b>${c.training}</b>
<p>Diet Type</p><b>${c.diet}</b>
<p>Notes</p><b>${c.notes || "—"}</b>
</div>

<button onclick="showPage('workout')">＋ Log Workout</button>`;
}

function workout(){

<h1>Log Workout</h1>

<div class="card">
<label>Client</label>
<select id="workClient">
${db.clients.map(x=>`<option value="${x.id}" ${x.id===selectedClient?"selected":""}>${x.name}</option>`).join("")}
</select>

<label>Workout Name</label>
<input id="workName" value="Chest + Triceps">

<label>Date</label>
<input id="workDate" type="date" value="${new Date().toISOString().slice(0,10)}">

<label>Exercise</label>
<select id="workExercise">
${db.exercises.map(x=>`<option>${x}</option>`).join("")}
</select>
</div>

<div class="card">
<div class="row"><h2 style="margin:0">Sets</h2><button onclick="addSet()">＋ Add Set</button></div>
<div style="overflow-x:auto">
<table>
<thead><tr><th>Set</th><th>Weight kg</th><th>Reps</th><th>RPE</th></tr></thead>
<tbody id="setsBody">
<tr><td>1</td><td><input class="sw" type="number" value="70"></td><td><input class="sr" type="number" value="8"></td><td><input class="se" type="number" value="8"></td></tr>
<tr><td>2</td><td><input class="sw" type="number" value="72.5"></td><td><input class="sr" type="number" value="8"></td><td><input class="se" type="number" value="8"></td></tr>
<tr><td>3</td><td><input class="sw" type="number" value="72.5"></td><td><input class="sr" type="number" value="8"></td><td><input class="se" type="number" value="9"></td></tr>
</tbody>
</table>
</div>
</div>

<div class="card">
<label>Heart Rate (bpm)</label>
<input id="workHR" type="number" value="142">

<label>Overall RPE</label>
<input id="workRPE" type="number" value="9">

<label>Rest Time (sec)</label>
<input id="workRest" type="number" value="90">

<label>Duration (min)</label>
<input id="workDuration" type="number" value="60">

<label>Notes</label>
<textarea id="workNotes">Good form. Increase weight next week.</textarea>
</div>

<div class="card">
<h2>Previous Workout</h2>
${previousWorkout(c.name)}
</div>

<button onclick="completeWorkout()">✓ Complete Workout</button>`;
}

function addSet(){
const body=document.getElementById("setsBody");
const n=body.rows.length+1;
body.insertAdjacentHTML("beforeend",
`<tr><td>${n}</td><td><input class="sw" type="number"></td><td><input class="sr" type="number"></td><td><input class="se" type="number"></td></tr>`);
}

function previousWorkout(name){
const w=db.workouts.find(x=>x.client===name);
if(!w)return "No previous workout";
return `${w.exercise}: ${w.sets[0][0]} kg × ${w.sets[0][1]} × ${w.sets.length} sets`;
}

function completeWorkout(){
const clientId=Number(document.getElementById("workClient").value);
const c=db.clients.find(x=>x.id===clientId);
const sets=[...document.querySelectorAll("#setsBody tr")].map(r=>{
const inputs=r.querySelectorAll("input");
return [Number(inputs[0].value)||0,Number(inputs[1].value)||0,Number(inputs[2].value)||0];
});

db.workouts.unshift({
client:c.name,
name:document.getElementById("workName").value,
date:document.getElementById("workDate").value,
exercise:document.getElementById("workExercise").value,
sets:sets,
hr:Number(document.getElementById("workHR").value)||0,
rpe:Number(document.getElementById("workRPE").value)||0,
rest:Number(document.getElementById("workRest").value)||0,
duration:Number(document.getElementById("workDuration").value)||0,
notes:document.getElementById("workNotes").value
});

alert("Workout completed and saved.");
showPage("history");
}

function addClient(){
app.innerHTML=`
<h1>Add Client</h1>

<div class="card">

<label>Client Name</label>
<input id="newName" placeholder="Enter client name">

<label>Age</label>
<input id="newAge" type="number" placeholder="Age">

<label>Height (cm)</label>
<input id="newHeight" type="number" placeholder="Height in cm">

<label>Weight (kg)</label>
<input id="newWeight" type="number" step="0.1" placeholder="Weight in kg">

<label>Goal</label>
<select id="newGoal">
<option>Lean Muscle Gain</option>
<option>Fat Loss</option>
<option>Muscle Building</option>
<option>Strength</option>
<option>General Fitness</option>
</select>

<label>Training Days</label>
<input id="newTraining" placeholder="e.g. 4–5 days/week">

<label>Diet Type</label>
<select id="newDiet">
<option>Non-Vegetarian</option>
<option>Vegetarian</option>
<option>Vegan</option>
<option>Other</option>
</select>

<label>Notes</label>
<textarea id="newNotes" placeholder="Injuries, limitations, other notes"></textarea>

<button onclick="saveNewClient()">✓ Save Client</button>
<button class="dark" onclick="showPage('clients')">Cancel</button>

</div>`;
}

function saveNewClient(){

const name=document.getElementById("newName").value.trim();
const age=Number(document.getElementById("newAge").value);
const height=Number(document.getElementById("newHeight").value);
const weight=Number(document.getElementById("newWeight").value);

if(!name || !age || !height || !weight){
alert("Please enter Name, Age, Height and Weight.");
return;
}

db.clients.push({
id:Date.now(),
name:name,
age:age,
height:height,
weight:weight,
goal:document.getElementById("newGoal").value,
training:document.getElementById("newTraining").value || "Not set",
diet:document.getElementById("newDiet").value,
notes:document.getElementById("newNotes").value
});

alert("Client added successfully.");
showPage("clients");
}

showPage("home");
</script>
